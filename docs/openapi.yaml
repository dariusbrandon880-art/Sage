components:
  schemas:
    AIQueryRequest:
      properties:
        prompt:
          type: "string"
          title: "Prompt"
        session_id:
          anyOf:
            -
              type: "string"
            -
              type: "null"
          title: "Session Id"
        include_validated_memory:
          type: "boolean"
          title: "Include Validated Memory"
          default: true
        include_knowledge_state:
          type: "boolean"
          title: "Include Knowledge State"
          default: true
        response_override:
          anyOf:
            -
              type: "string"
            -
              type: "null"
          title: "Response Override"
      type: "object"
      required:
        - "prompt"
      title: "AIQueryRequest"
    ArchivePromotionRequest:
      properties:
        memory_id:
          type: "string"
          title: "Memory Id"
        title:
          type: "string"
          title: "Title"
        tags:
          anyOf:
            -
              items:
                type: "string"
              type: "array"
