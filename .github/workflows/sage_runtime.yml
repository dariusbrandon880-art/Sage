name: SAGE Continuous Mission Operations Runtime

on:
  push:
    branches:
      - main
      - jules-*
  schedule:
    - cron: '0 */6 * * *' # Run every 6 hours safely
  workflow_dispatch: # Enable explicit manual trigger from tablet UI

jobs:
  sage-assembly-line:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          export PATH="$HOME/.local/bin:$PATH"

      - name: Configure Poetry Environment
        run: |
          poetry config virtualenvs.create true
          poetry config virtualenvs.in-project true

      - name: Cache Virtual Environment
        uses: actions/cache@v4
        id: cache-venv
        with:
          path: .venv
          key: ${{ runner.os }}-poetry-${{ hashFiles('**/poetry.lock') }}

      - name: Install Virtualenv Dependencies
        if: steps.cache-venv.outputs.cache-hit != 'true'
        run: |
          poetry install --no-root

      - name: Programmatic Emergency Stop Check
        run: |
          if [ -f "EMERGENCY_STOP" ] || [ -f "sage_data/EMERGENCY_STOP" ]; then
            echo "[🛑] SAGE Emergency Stop Triggered: Manual operator freeze lockfile detected! Aborting runner safely."
            exit 0
          fi
          echo "[🟢] Safety verification passed. No active EMERGENCY_STOP lockfiles observed."

      - name: Run SAGE Coordinated Multi-Agent Assembly Line
        run: |
          PYTHONPATH=. poetry run python scripts/run_ccl_orchestrator.py

      - name: Upload Persistent Mission Ledger (PML) & Evidence
        uses: actions/upload-artifact@v4
        with:
          name: SAGE-Mission-Evidence
          path: |
            evidence_capture/
            sage_data/experimental_pml/
