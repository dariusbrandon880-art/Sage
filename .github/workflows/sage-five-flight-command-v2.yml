name: SAGE Control Tower Five-Flight Command v2

on:
  issues:
    types: [opened, edited]
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  launch:
    if: >-
      ((github.event_name == 'issue_comment' && github.event.issue.number == 196 &&
      github.event.issue.pull_request == null && github.actor == 'dariusbrandon880-art' &&
      github.event.comment.body == '/sage launch five-flight') ||
      (github.event_name == 'issues' && github.event.issue.number == 196 &&
      github.event.issue.pull_request == null && github.actor == 'dariusbrandon880-art' &&
      github.event.action == 'opened'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - flight: "003"
            command: python scripts/run_longitudinal_flight_003.py
          - flight: "004"
            command: python scripts/run_longitudinal_campaign_flight.py --flight "004"
          - flight: "005"
            command: python scripts/run_longitudinal_campaign_flight.py --flight "005"
          - flight: "006"
            command: python scripts/run_longitudinal_campaign_flight.py --flight "006"
          - flight: "007"
            command: python scripts/run_longitudinal_campaign_flight.py --flight "007"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Governance preflight
        run: python scripts/sage_precommit_hook.py
      - name: Execute flight ${{ matrix.flight }}
        run: ${{ matrix.command }}
      - name: Flight receipt marker
        if: always()
        run: echo "SAGE_FLIGHT=${{ matrix.flight }} STATUS=${{ job.status }}"

  reconverge:
    needs: launch
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Five-flight completion gate
        run: |
          echo "Expected governed wave: 003 004 005 006 007"
          echo "Launch matrix completed with aggregate status: ${{ needs.launch.result }}"
          test "${{ needs.launch.result }}" = "success"
