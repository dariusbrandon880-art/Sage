name: SAGE Control Tower Five-Flight Command v2

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  flights:
    if: >-
      github.event.issue.number == 196 &&
      github.event.issue.pull_request == null &&
      github.actor == 'dariusbrandon880-art' &&
      github.event.comment.body == '/sage launch five-flight'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - flight: "003"
            name: "Horizon Residual"
            command: python scripts/run_longitudinal_flight_003.py
          - flight: "004"
            name: "Recovery"
            command: python scripts/run_longitudinal_campaign_flight.py --flight 004
          - flight: "005"
            name: "Reuse"
            command: python scripts/run_longitudinal_campaign_flight.py --flight 005
          - flight: "006"
            name: "Retention Regression"
            command: python scripts/run_longitudinal_campaign_flight.py --flight 006
          - flight: "007"
            name: "Compound"
            command: python scripts/run_longitudinal_campaign_flight.py --flight 007
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Governance preflight
        run: python scripts/sage_precommit_hook.py
      - name: Execute flight ${{ matrix.flight }} — ${{ matrix.name }}
        run: |
          set -o pipefail
          ${{ matrix.command }} | tee "flight-${{ matrix.flight }}.json"
      - name: Upload flight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sage-five-flight-${{ matrix.flight }}-${{ github.sha }}
          path: flight-${{ matrix.flight }}.json
          if-no-files-found: error

  reconverge:
    if: always() && github.event.issue.number == 196 && github.event.issue.pull_request == null && github.actor == 'dariusbrandon880-art' && github.event.comment.body == '/sage launch five-flight'
    needs: flights
    runs-on: ubuntu-latest
    steps:
      - name: Five-flight completion gate
        run: |
          test "${{ needs.flights.result }}" = success
          echo 'SAGE_FIVE_FLIGHT_WAVE_COMPLETE=003,004,005,006,007'
          echo 'REQUIRES_INDEPENDENT_C2_VERIFICATION=true'
