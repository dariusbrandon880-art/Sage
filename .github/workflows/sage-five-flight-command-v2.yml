name: SAGE Control Tower Five-Flight Command v2

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  flights:
    if: >-
      github.event.issue.number == 196 &&
      github.event.issue.pull_request == null &&
      github.actor == 'dariusbrandon880-art' &&
      github.event.comment.body == '/sage launch five-flight'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Governance preflight
        run: python scripts/sage_precommit_hook.py
      - name: Flight 003 — Horizon Residual
        run: python scripts/run_longitudinal_flight_003.py | tee flight-003.json
      - name: Flight 004 — Recovery
        run: python scripts/run_longitudinal_campaign_flight.py --flight 004 | tee flight-004.json
      - name: Flight 005 — Reuse
        run: python scripts/run_longitudinal_campaign_flight.py --flight 005 | tee flight-005.json
      - name: Flight 006 — Retention Regression
        run: python scripts/run_longitudinal_campaign_flight.py --flight 006 | tee flight-006.json
      - name: Flight 007 — Compound
        run: python scripts/run_longitudinal_campaign_flight.py --flight 007 | tee flight-007.json
      - name: Upload five-flight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sage-five-flight-sequential-${{ github.sha }}
          path: flight-*.json
          if-no-files-found: error
      - name: Five-flight completion gate
        run: |
          test -s flight-003.json
          test -s flight-004.json
          test -s flight-005.json
          test -s flight-006.json
          test -s flight-007.json
          echo 'SAGE_FIVE_FLIGHT_WAVE_COMPLETE=003,004,005,006,007'
