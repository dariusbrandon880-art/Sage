name: C2 GPT Boundary Big Build

on:
  push:
    branches:
      - feat/c2-full-gpt-sage-boundary

permissions:
  contents: write

jobs:
  integrate-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact HEAD
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install .
          pip install pytest

      - name: Apply GPT -> SAGE integration boundary
        run: python scripts/patch_chatgpt_boundary.py

      - name: Migrate ChatGPT regression fixtures
        run: python scripts/patch_chatgpt_boundary_tests.py

      - name: Run focused boundary tests
        run: |
          pytest -q tests/c2/test_chatgpt_sage_boundary.py tests/c2/test_chatgpt_runtime.py

      - name: Run OpenAI runtime regression
        run: pytest -q tests/test_openai_runtime_activation.py

      - name: Commit exact integration result
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if git diff --quiet; then
            echo "No integration delta produced; refusing silent success."
            exit 1
          fi
          git config user.name "SAGE C2 Build"
          git config user.email "sage-c2-build@users.noreply.github.com"
          git add sage/integration.py tests/test_openai_runtime_activation.py
          git commit -m "feat(c2): bind ChatGPTClient to SAGE runtime boundary"
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Verify no direct provider bypass remains
        run: |
          test "$(grep -R -l 'openai\.OpenAI' sage | grep -v 'sage/c2/chatgpt_sage_boundary.py' | wc -l)" -eq 0
          grep -q 'execute_sage_bound_chatgpt_from_legacy_runtime' sage/integration.py

      - name: Remove one-shot build workflow
        if: success()
        run: |
          git rm .github/workflows/c2-gpt-boundary-build.yml
          git commit -m "chore(c2): remove one-shot GPT boundary build workflow"
          git push origin HEAD:${GITHUB_REF_NAME}
