name: Sage 2 Governed CI & Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  SAGE_CI_OPENAI_STUB: "1"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: SAGE Pre-Commit Governance & Attestation Check
      run: python scripts/sage_precommit_hook.py

    - name: Run pytest
      run: pytest -v --tb=short

    - name: Execute longitudinal pilot flight
      run: |
        set -o pipefail
        python scripts/run_longitudinal_flight.py | tee longitudinal_pilot_stdout.json

    - name: Publish longitudinal pilot telemetry
      if: always()
      run: |
        {
          echo "## SAGE Longitudinal Pilot Telemetry"
          echo
          echo "Commit: $GITHUB_SHA"
          if [ -f longitudinal_pilot_stdout.json ]; then
            echo '```json'
            cat longitudinal_pilot_stdout.json
            echo '```'
          else
            echo "No pilot stdout report was produced. Flight execution failed before report emission."
          fi
        } >> "$GITHUB_STEP_SUMMARY"

    - name: Upload longitudinal pilot evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sage-longitudinal-pilot-${{ github.sha }}
        path: longitudinal_pilot_stdout.json
        if-no-files-found: warn
