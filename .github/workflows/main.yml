name: Sage 2 Governed CI & Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

env:
  SAGE_CI_OPENAI_STUB: "1"

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"

    - name: SAGE Pre-Commit Governance & Attestation Check
      run: python scripts/sage_precommit_hook.py

    - name: Run pytest
      run: pytest -v --tb=short
