name: Sage 2 Governed CI & Test Suite

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SAGE_CI_OPENAI_STUB: "1"
  # Deterministic non-production credential used only by repository tests.
  # Production credentials remain external secrets/environment configuration.
  SAGE_API_KEYS: "sage-default-key-2026"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: SAGE Pre-Commit Governance & Attestation Check
        run: python scripts/sage_precommit_hook.py
      - name: Run pytest
        run: pytest -v --tb=short

  portfolio-diversity:
    name: "C2 Sports Portfolio Diversity Receipt"
    if: ${{ always() }}
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Generate portfolio diversity receipt
        run: python scripts/execute_sports_portfolio_diversity.py
      - name: Upload portfolio diversity receipt artifact
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sage-portfolio-diversity-receipt-${{ github.sha }}
          path: |
            evidence_capture/sports_portfolio_diversity_receipt.json
            portfolio_diversity_receipt.json
          if-no-files-found: error

  five-front-full-engine:
    name: "C2 Full Engine / Flight ${{ matrix.flight }}"
    if: ${{ always() }}
    needs: test
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - flight: "003"
            command: python scripts/run_longitudinal_flight_003.py
          - flight: "004"
            command: python scripts/run_longitudinal_campaign_flight.py --flight 004
          - flight: "005"
            command: python scripts/run_longitudinal_campaign_flight.py --flight 005
          - flight: "006"
            command: python scripts/run_longitudinal_campaign_flight.py --flight 006
          - flight: "007"
            command: python scripts/run_longitudinal_campaign_flight.py --flight 007
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: "01 RECON — Flight ${{ matrix.flight }}"
        id: recon
        continue-on-error: true
        env:
          FLIGHT: ${{ matrix.flight }}
          COMMAND: ${{ matrix.command }}
        run: |
          set +e
          if [ "$FLIGHT" = "003" ]; then
            test -f scripts/run_longitudinal_flight_003.py
            rc=$?
            if [ "$rc" -eq 0 ]; then python -m compileall -q scripts/run_longitudinal_flight_003.py; rc=$?; fi
          else
            test -f scripts/run_longitudinal_campaign_flight.py
            rc=$?
            if [ "$rc" -eq 0 ]; then python -m compileall -q scripts/run_longitudinal_campaign_flight.py; rc=$?; fi
          fi
          python - "$rc" <<'PY'
          import json
          import sys
          from pathlib import Path
          rc = int(sys.argv[1])
          report = {
              "stage": "RECON",
              "flight": "${{ matrix.flight }}",
              "status": "PASS" if rc == 0 else "FAIL",
              "exit_code": rc,
              "command": "${{ matrix.command }}",
              "commit_sha": "${{ github.sha }}",
              "run_id": "${{ github.run_id }}",
              "job": "${{ github.job }}",
          }
          Path("front_recon.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          raise SystemExit(rc)
          PY

      - name: "02 BUILD — Flight ${{ matrix.flight }}"
        id: build
        if: always()
        continue-on-error: true
        run: |
          set +e
          ${{ matrix.command }} > flight_output.json
          rc=$?
          python - "$rc" <<'PY'
          import json
          import sys
          from pathlib import Path
          rc = int(sys.argv[1])
          report = {
              "stage": "BUILD",
              "flight": "${{ matrix.flight }}",
              "status": "PASS" if rc == 0 else "FAIL",
              "exit_code": rc,
              "execution": "repository_flight_command",
              "commit_sha": "${{ github.sha }}",
              "run_id": "${{ github.run_id }}",
              "job": "${{ github.job }}",
          }
          Path("front_build.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          raise SystemExit(rc)
          PY

      - name: "03 OBSERVE / REPAIR — Flight ${{ matrix.flight }}"
        id: repair
        if: always()
        continue-on-error: true
        run: |
          set +e
          ${{ matrix.command }} > flight_repair_output.json
          rc=$?
          python - "$rc" <<'PY'
          import json
          import sys
          from pathlib import Path
          rc = int(sys.argv[1])
          report = {
              "stage": "OBSERVE",
              "flight": "${{ matrix.flight }}",
              "status": "PASS" if rc == 0 else "FAIL",
              "exit_code": rc,
              "repair_mode": "none; repair requires a new governed build commit",
              "commit_sha": "${{ github.sha }}",
              "run_id": "${{ github.run_id }}",
              "job": "${{ github.job }}",
          }
          Path("front_repair.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          raise SystemExit(rc)
          PY

      - name: "04 VERIFY / COMPOUND — Flight ${{ matrix.flight }}"
        id: verify
        if: always()
        continue-on-error: true
        run: |
          set +e
          ${{ matrix.command }} > flight_verify_output.json
          rc=$?
          if [ "$rc" -eq 0 ]; then python -m compileall -q sage scripts; rc=$?; fi
          python - "$rc" <<'PY'
          import json
          import sys
          from pathlib import Path
          rc = int(sys.argv[1])
          report = {
              "stage": "VERIFY_COMPOUND",
              "flight": "${{ matrix.flight }}",
              "status": "PASS" if rc == 0 else "FAIL",
              "exit_code": rc,
              "authority_boundary": "execution evidence only; C2 must independently verify before qualification",
              "commit_sha": "${{ github.sha }}",
              "run_id": "${{ github.run_id }}",
              "job": "${{ github.job }}",
          }
          Path("front_verify.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          raise SystemExit(rc)
          PY

      - name: Build full-engine receipt
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          stages = []
          for stage in ("recon", "build", "repair", "verify"):
              path = Path(f"front_{stage}.json")
              data = json.loads(path.read_text()) if path.exists() else None
              stages.append({
                  "stage": stage,
                  "present": path.exists(),
                  "status": data.get("status") if data else "MISSING",
                  "exit_code": data.get("exit_code") if data else None,
              })
          all_present = all(item["present"] for item in stages)
          all_passed = all(item["status"] == "PASS" for item in stages)
          report = {
              "wave": "SAGE-C2-FIVE-CONCURRENT-FULL-ENGINE",
              "flight": "${{ matrix.flight }}",
              "expected_stages": 4,
              "stages": stages,
              "all_stage_receipts_present": all_present,
              "all_stage_passed": all_passed,
              "wave_front_verdict": "PASS" if all_present and all_passed else "FAIL",
              "commit_sha": "${{ github.sha }}",
              "run_id": "${{ github.run_id }}",
              "job": "${{ github.job }}",
          }
          Path("front_receipt.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          if not all_present or not all_passed:
              raise SystemExit(1)
          PY

      - name: Upload front evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sage-c2-full-engine-flight-${{ matrix.flight }}-${{ github.sha }}
          path: front_*.json
          if-no-files-found: error

  reconverge:
    name: C2 Five-Flight Fail-Closed Reconvergence
    if: ${{ always() }}
    needs: [test, portfolio-diversity, five-front-full-engine]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download five flight evidence without collision
        uses: actions/download-artifact@v6
        with:
          pattern: sage-c2-full-engine-flight-*
          path: five-flight-evidence
          merge-multiple: false
      - name: Verify complete five-flight wave
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          root = Path("five-flight-evidence")
          expected = {"003", "004", "005", "006", "007"}
          receipts = []
          for path in root.glob("*/front_receipt.json"):
              try:
                  receipts.append(json.loads(path.read_text()))
              except (OSError, json.JSONDecodeError):
                  continue
          expected_sha = os.environ.get("GITHUB_SHA")
          provenance = {str(data.get("commit_sha")) for data in receipts if data.get("commit_sha")}
          valid = [
              data for data in receipts
              if data.get("flight") in expected
              and data.get("all_stage_receipts_present") is True
              and data.get("all_stage_passed") is True
              and data.get("commit_sha") == expected_sha
          ]
          observed = {data["flight"] for data in valid}
          missing = sorted(expected - observed)
          duplicates = sorted(
              flight for flight in expected
              if sum(1 for data in valid if data.get("flight") == flight) > 1
          )
          invalid = sorted({str(data.get("flight")) for data in receipts if data.get("flight") not in expected})
          stale_or_mixed = sorted(provenance - {expected_sha}) if expected_sha else sorted(provenance)
          all_flights_pass = len(valid) == 5 and not missing and not duplicates and not invalid and not stale_or_mixed and provenance == {expected_sha}
          report = {
              "wave": "SAGE-C2-FIVE-CONCURRENT-FULL-ENGINE",
              "expected_flights": 5,
              "observed_flights": len(observed),
              "missing_flights": missing,
              "duplicate_flights": duplicates,
              "invalid_flights": invalid,
              "provenance_commits": sorted(provenance),
              "expected_commit": expected_sha,
              "stale_or_mixed_commits": stale_or_mixed,
              "wave_verdict": "REQUIRES_INDEPENDENT_C2_VERIFICATION" if all_flights_pass else "HOLD",
              "authority_boundary": "Aggregates execution observations; does not qualify capability.",
          }
          Path("sage_c2_five_flight_wave_report.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          if not all_flights_pass:
              raise SystemExit(1)
          PY
      - name: Upload compound evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sage-c2-five-flight-wave-${{ github.sha }}
          path: sage_c2_five_flight_wave_report.json
          if-no-files-found: error
