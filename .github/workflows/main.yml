name: Sage 2 Governed CI & Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  SAGE_CI_OPENAI_STUB: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: SAGE Pre-Commit Governance & Attestation Check
      run: python scripts/sage_precommit_hook.py
    - name: Run pytest
      run: pytest -v --tb=short

  five-front-full-engine:
    name: "C2 Full Engine / ${{ matrix.front }}"
    needs: test
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - front: DRIVE_CONTINUITY
            target: scripts/verify_drive_projection_handshake.py
            tests: tests
            search: "drive continuity projection persistence"
          - front: GOVERNED_EXECUTION
            target: sage/c2/frontier_execution.py
            tests: tests/test_c2_five_fronts.py
            search: "failure memory prefight authorization safety governed execution verification receipt evidence"
          - front: SPORTS_RESEARCH
            target: sage/experimental
            tests: tests
            search: "sports scientific research leakage OOS robustness evidence"
          - front: NATIVE_PERSISTED_EVIDENCE
            target: sage/evidence/native_persisted_loader.py
            tests: tests/test_c2_five_fronts.py
            search: "native persisted evidence ArchiveEntry fail closed"
          - front: PROGRESSION_RECEIPTS
            target: sage/c2/progression_receipt_serializer.py
            tests: tests/test_c2_five_fronts.py
            search: "MissionProgressionReceipt canonical serialization digest"
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: "01 RECON — ${{ matrix.front }}"
      run: |
        set -euo pipefail
        if [ -f "${{ matrix.target }}" ]; then python -m compileall -q "${{ matrix.target }}"; ruff check "${{ matrix.target }}"; else test -d "${{ matrix.target }}"; python -m compileall -q "${{ matrix.target }}"; ruff check "${{ matrix.target }}"; fi
        python - <<'PY'
        import json
        from pathlib import Path
        report={"stage":"RECON","front":"${{ matrix.front }}","external_challenge_query":"${{ matrix.search }}","status":"PASS"}
        Path("front_recon.json").write_text(json.dumps(report,indent=2))
        print(json.dumps(report,indent=2))
        PY
    - name: "02 BUILD — ${{ matrix.front }}"
      run: |
        set -euo pipefail
        pytest -q "${{ matrix.tests }}" --tb=short
        python - <<'PY'
        import json
        from pathlib import Path
        report={"stage":"BUILD","front":"${{ matrix.front }}","status":"PASS","execution":"repository_tests"}
        Path("front_build.json").write_text(json.dumps(report,indent=2))
        print(json.dumps(report,indent=2))
        PY
    - name: "03 OBSERVE / REPAIR — ${{ matrix.front }}"
      if: always()
      run: |
        set -euo pipefail
        pytest -q "${{ matrix.tests }}" --tb=short
        ruff check "${{ matrix.target }}"
        python - <<'PY'
        import json
        from pathlib import Path
        report={"stage":"OBSERVE_REPAIR","front":"${{ matrix.front }}","status":"PASS","repair_mode":"validated-rerun; no semantic mutation on green evidence"}
        Path("front_repair.json").write_text(json.dumps(report,indent=2))
        print(json.dumps(report,indent=2))
        PY
    - name: "04 VERIFY / COMPOUND — ${{ matrix.front }}"
      if: always()
      run: |
        set -euo pipefail
        pytest -q "${{ matrix.tests }}" --tb=short
        python -m compileall -q sage scripts
        ruff check "${{ matrix.target }}"
        python - <<'PY'
        import json
        from pathlib import Path
        report={"stage":"VERIFY_COMPOUND","front":"${{ matrix.front }}","status":"PASS","authority_boundary":"execution evidence only; C2 must independently verify before qualification"}
        Path("front_verify.json").write_text(json.dumps(report,indent=2))
        print(json.dumps(report,indent=2))
        PY
    - name: Build full-engine receipt
      if: always()
      run: |
        python - <<'PY'
        import json
        from pathlib import Path
        stages=[]
        for stage in ("recon","build","repair","verify"):
            p=Path(f"front_{stage}.json")
            stages.append({"stage":stage,"present":p.exists()})
        report={"wave":"SAGE-C2-FIVE-CONCURRENT-FULL-ENGINE","front":"${{ matrix.front }}","expected_stages":4,"stages":stages,"all_stage_receipts_present":all(x["present"] for x in stages)}
        Path("front_receipt.json").write_text(json.dumps(report,indent=2))
        print(json.dumps(report,indent=2))
        PY
    - name: Upload front evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sage-c2-full-engine-${{ matrix.front }}-${{ github.sha }}
        path: front_*.json
        if-no-files-found: ignore

  reconverge:
    name: C2 Five-Front Fail-Closed Reconvergence
    if: ${{ always() }}
    needs: [test, five-front-full-engine]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Download five front evidence without collision
      uses: actions/download-artifact@v4
      with:
        pattern: sage-c2-full-engine-*
        path: five-front-evidence
        merge-multiple: false
    - name: Verify complete five-front wave
      run: |
        python - <<'PY'
        import json
        from pathlib import Path
        root=Path("five-front-evidence")
        expected={"DRIVE_CONTINUITY","GOVERNED_EXECUTION","SPORTS_RESEARCH","NATIVE_PERSISTED_EVIDENCE","PROGRESSION_RECEIPTS"}
        receipts=[]
        for p in root.glob("*/front_receipt.json"):
            try:
                data=json.loads(p.read_text())
            except Exception:
                continue
            receipts.append(data)
        observed={d.get("front") for d in receipts if d.get("all_stage_receipts_present") and d.get("front") in expected}
        missing=sorted(expected-observed)
        duplicate_fronts=sorted({f for f in observed if sum(1 for d in receipts if d.get("front")==f)>=2})
        invalid=sorted({str(d.get("front")) for d in receipts if d.get("front") not in expected})
        report={"wave":"SAGE-C2-FIVE-CONCURRENT-FULL-ENGINE","expected_fronts":5,"observed_fronts":len(observed),"missing_fronts":missing,"duplicate_fronts":duplicate_fronts,"invalid_fronts":invalid,"wave_verdict":"HOLD" if (missing or duplicate_fronts or invalid) else "REQUIRES_INDEPENDENT_C2_VERIFICATION","authority_boundary":"Aggregates execution observations; does not qualify capability."}
        Path("sage_c2_five_front_wave_report.json").write_text(json.dumps(report,indent=2))
        print(json.dumps(report,indent=2))
        if missing or duplicate_fronts or invalid: raise SystemExit(1)
        PY
    - name: Upload compound evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sage-c2-five-front-wave-${{ github.sha }}
        path: sage_c2_five_front_wave_report.json
        if-no-files-found: error
