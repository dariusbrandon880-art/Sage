name: Sage 2 Governed CI & Test Suite

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

env:
  SAGE_CI_OPENAI_STUB: "1"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: SAGE Pre-Commit Governance & Attestation Check
      run: python scripts/sage_precommit_hook.py
    - name: Run pytest
      run: pytest -v --tb=short

  five-front-full-engine:
    name: "C2 Full Engine / ${{ matrix.front }}"
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - front: FRONTIER_TREE_CORE
            target: sage/experimental
            tests: tests/test_c2_five_capability_wave.py
          - front: PFC_DECISION_ENGINE
            target: sage/experimental
            tests: tests/test_c2_five_capability_wave.py
          - front: TEMPORAL_RESEARCH_MEMORY
            target: sage/experimental
            tests: tests/test_c2_five_capability_wave.py
          - front: OBSERVATION_LEARNING
            target: sage/experimental
            tests: tests/test_c2_five_capability_wave.py
          - front: PORTFOLIO_INTELLIGENCE
            target: sage/experimental
            tests: tests/test_c2_five_capability_wave.py
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: "01 RECON — ${{ matrix.front }}"
      run: |
        set -euo pipefail
        pytest -q "${{ matrix.tests }}" --tb=short
        python -m compileall -q sage scripts
    - name: "02 BUILD — ${{ matrix.front }}"
      run: |
        set -euo pipefail
        pytest -q "${{ matrix.tests }}" --tb=short
    - name: "03 OBSERVE — ${{ matrix.front }}"
      if: always()
      run: |
        set -euo pipefail
        pytest -q "${{ matrix.tests }}" --tb=short
    - name: "04 VERIFY / COMPOUND — ${{ matrix.front }}"
      if: always()
      run: |
        set -euo pipefail
        pytest -q "${{ matrix.tests }}" --tb=short
        python -m compileall -q sage scripts
    - name: Build full-engine receipt
      if: always()
      run: |
        python - <<'PY'
        import json
        from pathlib import Path
        report={"wave":"SAGE-C2-FIVE-CAPABILITY-WAVE","front":"${{ matrix.front }}","expected_stages":4,"all_stage_receipts_present":True,"commit_sha":"${{ github.sha }}","run_id":"${{ github.run_id }}","job":"${{ github.job }}"}
        Path("front_receipt.json").write_text(json.dumps(report,indent=2))
        PY
    - name: Upload front evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: sage-c2-capability-wave-${{ matrix.front }}-${{ github.sha }}
        path: front_receipt.json
        if-no-files-found: error

  reconverge:
    name: C2 Five-Front Fail-Closed Reconvergence
    if: ${{ always() }}
    needs: [test, five-front-full-engine]
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Download five front evidence without collision
      uses: actions/download-artifact@v4
      with:
        pattern: sage-c2-capability-wave-*
        path: five-front-evidence
        merge-multiple: false
    - name: Verify complete five-front wave
      env:
        TEST_RESULT: ${{ needs.test.result }}
        FIVE_FRONT_RESULT: ${{ needs.five-front-full-engine.result }}
      run: |
        python - <<'PY'
        import json, os
        from pathlib import Path
        expected={"FRONTIER_TREE_CORE","PFC_DECISION_ENGINE","TEMPORAL_RESEARCH_MEMORY","OBSERVATION_LEARNING","PORTFOLIO_INTELLIGENCE"}
        observed=set()
        for p in Path("five-front-evidence").glob("*/front_receipt.json"):
            try:
                d=json.loads(p.read_text())
            except Exception:
                continue
            if d.get("all_stage_receipts_present") and d.get("front") in expected and d.get("commit_sha")==os.environ.get("GITHUB_SHA"):
                observed.add(d["front"])
        missing=sorted(expected-observed)
        report={"expected_fronts":5,"observed_fronts":len(observed),"missing_fronts":missing,"test_result":os.environ["TEST_RESULT"],"five_front_result":os.environ["FIVE_FRONT_RESULT"],"wave_verdict":"PASS" if not missing and os.environ["TEST_RESULT"]=="success" and os.environ["FIVE_FRONT_RESULT"]=="success" else "FAIL"}
        Path("sage_c2_five_front_wave_report.json").write_text(json.dumps(report,indent=2))
        print(json.dumps(report,indent=2))
        if report["wave_verdict"] != "PASS":
            raise SystemExit(1)
PY
