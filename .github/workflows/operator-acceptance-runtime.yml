name: SAGE Operator Acceptance Runtime

on:
  pull_request:
    paths:
      - 'sage/c2/operator_acceptance_bootstrap.py'
      - 'sage/c2/mission_continuity.py'
      - 'scripts/run_operator_acceptance_bootstrap.py'
      - 'scripts/build_session_manifest.py'
      - 'scripts/verify_session_rehydration_contract.py'
      - 'tests/c2/test_operator_acceptance_bootstrap.py'
      - 'tests/c2/test_session_manifest.py'
      - '.github/workflows/operator-acceptance-runtime.yml'
      - 'docs/governance/SAGE_SESSION_REHYDRATION_CONTRACT.md'
      - 'docs/governance/SAGE_SESSION_STATE_MANIFEST.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bootstrap-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Cold-start and drift regression
        run: pytest -q tests/c2/test_operator_acceptance_bootstrap.py tests/c2/test_session_manifest.py
      - name: Materialize live session manifest
        run: |
          python scripts/build_session_manifest.py \
            --mission ci-bootstrap \
            --required-interface chatgpt \
            --required-interface gemini \
            --required-interface jules
      - name: Verify materialized session rehydration contract
        run: python scripts/verify_session_rehydration_contract.py
      - name: Exercise full multi-surface acceptance
        run: |
          python scripts/run_operator_acceptance_bootstrap.py \
            --mission-id ci-bootstrap \
            --main-goal "mission continuity" \
            --flight F1 \
            --required-interface chatgpt \
            --required-interface gemini \
            --required-interface jules \
            --operator-interface chatgpt \
            --operator-interface gemini \
            --operator-interface jules \
            --operator-verdict PASS \
            --operator-verdict PASS \
            --operator-verdict PASS \
            --evidence-ref ci://operator-acceptance/chatgpt \
            --evidence-ref ci://operator-acceptance/gemini \
            --evidence-ref ci://operator-acceptance/jules \
            --output /tmp/operator_acceptance_receipt.json
          python - <<'PY'
          import json
          with open('/tmp/operator_acceptance_receipt.json', encoding='utf-8') as f:
              receipt = json.load(f)
          assert receipt['acceptance_status'] == 'ACCEPTED', receipt
          assert all(v == 'PASS' for v in receipt['interface_verdicts'].values()), receipt
          assert receipt['empirical_gate']['checks']['full_surface_convergence'] is True, receipt
          print(json.dumps({'status': 'ACCEPTED', 'interfaces': receipt['interface_verdicts']}))
          PY
      - name: Exact HEAD binding
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "${#EXPECTED_SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
