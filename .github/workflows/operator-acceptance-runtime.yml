name: SAGE Operator Acceptance Runtime

on:
  pull_request:
    paths:
      - 'sage/c2/operator_acceptance_bootstrap.py'
      - 'sage/c2/mission_continuity.py'
      - 'scripts/run_operator_acceptance_bootstrap.py'
      - 'scripts/build_session_manifest.py'
      - 'scripts/verify_session_rehydration_contract.py'
      - 'tests/c2/test_operator_acceptance_bootstrap.py'
      - 'tests/c2/test_session_manifest.py'
      - 'tests/c2/test_operator_acceptance_runtime_workflow.py'
      - '.github/workflows/operator-acceptance-runtime.yml'
      - 'docs/governance/SAGE_SESSION_REHYDRATION_CONTRACT.md'
      - 'docs/governance/SAGE_SESSION_STATE_MANIFEST.json'
  workflow_dispatch:
    inputs:
      operator_evidence:
        description: 'Verified operator evidence JSON; acceptance remains BLOCKED when absent.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  bootstrap-runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install project
        run: pip install -e '.[dev]'
      - name: Cold-start and drift regression
        run: pytest -q tests/c2/test_operator_acceptance_bootstrap.py tests/c2/test_session_manifest.py tests/c2/test_operator_acceptance_runtime_workflow.py
      - name: Materialize live session manifest
        run: |
          python scripts/build_session_manifest.py \
            --mission ci-bootstrap \
            --required-interface chatgpt \
            --required-interface gemini \
            --required-interface jules
      - name: Verify materialized session rehydration contract
        run: python scripts/verify_session_rehydration_contract.py
      - name: Evaluate operator acceptance honestly
        env:
          OPERATOR_EVIDENCE: ${{ inputs.operator_evidence }}
        run: |
          python - <<'PY'
          import json, os, sys
          raw = os.environ.get('OPERATOR_EVIDENCE', '').strip()
          if not raw:
              print('OPERATOR ACCEPTANCE: BLOCKED — no verified external operator evidence supplied')
              sys.exit(0)
          try:
              evidence = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise SystemExit(f'Invalid operator evidence JSON: {exc}')
          required = {'chatgpt', 'gemini', 'jules'}
          verdicts = evidence.get('interface_verdicts', {})
          missing = required - set(verdicts)
          if missing:
              raise SystemExit(f'Incomplete operator evidence; missing: {sorted(missing)}')
          if any(verdicts[name] != 'PASS' for name in required):
              raise SystemExit(f'Operator acceptance not proven: {verdicts}')
          refs = evidence.get('evidence_refs', {})
          if any(not refs.get(name) or str(refs[name]).startswith('ci://') for name in required):
              raise SystemExit('Synthetic or missing operator evidence refs are forbidden')
          print(json.dumps({'status': 'ACCEPTED', 'interfaces': verdicts}, sort_keys=True))
          PY
      - name: Exact HEAD binding
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "${#EXPECTED_SHA}" -eq 40
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
