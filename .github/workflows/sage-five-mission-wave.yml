name: SAGE Five-Mission Control Tower Wave

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flight:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - id: F1
            mission: google-drive-continuity
            test: tests/test_projection.py
          - id: F2
            mission: sports-scientific-integrity
            test: tests
          - id: F3
            mission: cognitive-pfc-compound
            test: tests/experimental/test_cognitive_kernel.py
          - id: F4
            mission: evidence-lineage-replay
            test: tests
          - id: F5
            mission: progression-receipt-control-tower
            test: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install repository
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]' || pip install -e .
      - name: Mission preflight
        id: preflight
        continue-on-error: true
        env:
          SAGE_FLIGHT_ID: ${{ matrix.id }}
          SAGE_MISSION: ${{ matrix.mission }}
        run: |
          set +e
          python -m compileall -q sage scripts
          rc=$?
          if [ "$rc" -eq 0 ]; then ruff check sage scripts; rc=$?; fi
          python - "$rc" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path
          rc = int(sys.argv[1])
          report = {
              "flight": os.environ["SAGE_FLIGHT_ID"],
              "mission": os.environ["SAGE_MISSION"],
              "stage": "PREFLIGHT",
              "status": "PASS" if rc == 0 else "FAIL",
              "exit_code": rc,
              "commit_sha": "${{ github.sha }}",
              "run_id": "${{ github.run_id }}",
          }
          Path("flight_preflight.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          raise SystemExit(rc)
          PY
      - name: Execute full repository verification for mission
        id: verify
        if: always()
        continue-on-error: true
        run: |
          set +e
          python -m pytest -q ${{ matrix.test }}
          rc=$?
          python - "$rc" <<'PY'
          import json
          import sys
          from pathlib import Path
          rc = int(sys.argv[1])
          report = {
              "flight": "${{ matrix.id }}",
              "mission": "${{ matrix.mission }}",
              "stage": "VERIFY",
              "status": "PASS" if rc == 0 else "FAIL",
              "exit_code": rc,
              "commit_sha": "${{ github.sha }}",
              "run_id": "${{ github.run_id }}",
          }
          Path("flight_verify.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          raise SystemExit(rc)
          PY
      - name: Build flight receipt
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths = [Path("flight_preflight.json"), Path("flight_verify.json")]
          stages = []
          for path in paths:
              data = json.loads(path.read_text()) if path.exists() else None
              stages.append({
                  "stage": data.get("stage") if data else path.stem,
                  "present": path.exists(),
                  "status": data.get("status") if data else "MISSING",
              })
          report = {
              "flight": "${{ matrix.id }}",
              "mission": "${{ matrix.mission }}",
              "commit_sha": "${{ github.sha }}",
              "run_id": "${{ github.run_id }}",
              "stages": stages,
              "all_stage_receipts_present": all(stage["present"] for stage in stages),
              "all_stage_passed": all(stage["status"] == "PASS" for stage in stages),
          }
          Path("flight_receipt.json").write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          if not report["all_stage_receipts_present"] or not report["all_stage_passed"]:
              raise SystemExit(1)
          PY
      - name: Upload flight evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sage-five-mission-${{ matrix.id }}-${{ github.sha }}
          path: flight_*.json
          if-no-files-found: error

  wave-gate:
    needs: flight
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all five flights
        run: |
          test '${{ needs.flight.result }}' = 'success'
          echo 'FIVE_MISSION_WAVE=VERIFIED'
