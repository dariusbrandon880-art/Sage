name: SAGE Five-Flight Reusable Execution Wave

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  SAGE_CI_OPENAI_STUB: "1"

jobs:
  flight:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {flight: "003", command: "python scripts/run_longitudinal_flight_003.py"}
          - {flight: "004", command: "python scripts/run_longitudinal_campaign_flight.py --flight 004"}
          - {flight: "005", command: "python scripts/run_longitudinal_campaign_flight.py --flight 005"}
          - {flight: "006", command: "python scripts/run_longitudinal_campaign_flight.py --flight 006"}
          - {flight: "007", command: "python scripts/run_longitudinal_campaign_flight.py --flight 007"}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout canonical main
        uses: actions/checkout@v5
      - name: Setup Python
        uses: actions/setup-python@v6
        with: {python-version: '3.12'}
      - name: Install repository
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: Flight preflight
        id: preflight
        continue-on-error: true
        env:
          FLIGHT: ${{ matrix.flight }}
          COMMAND: ${{ matrix.command }}
        run: |
          set +e
          python scripts/sage_precommit_hook.py
          rc=$?
          python - "$rc" <<'PY'
          import json,os,sys
          from pathlib import Path
          rc=int(sys.argv[1])
          report={'flight':os.environ['FLIGHT'],'stage':'PREFLIGHT','status':'PASS' if rc==0 else 'FAIL','exit_code':rc,'commit_sha':'${{ github.sha }}','run_id':'${{ github.run_id }}'}
          Path('flight_preflight.json').write_text(json.dumps(report,indent=2)); print(json.dumps(report,indent=2)); raise SystemExit(rc)
          PY
      - name: Execute flight runner
        id: verify
        if: always()
        continue-on-error: true
        run: |
          set +e
          ${{ matrix.command }} > flight_output.json
          rc=$?
          python - "$rc" <<'PY'
          import json,sys
          from pathlib import Path
          rc=int(sys.argv[1])
          report={'flight':'${{ matrix.flight }}','stage':'VERIFY','status':'PASS' if rc==0 else 'FAIL','exit_code':rc,'commit_sha':'${{ github.sha }}','run_id':'${{ github.run_id }}'}
          Path('flight_verify.json').write_text(json.dumps(report,indent=2)); print(json.dumps(report,indent=2)); raise SystemExit(rc)
          PY
      - name: Build flight receipt
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          paths=[Path('flight_preflight.json'),Path('flight_verify.json')]; stages=[]
          for path in paths:
              data=json.loads(path.read_text()) if path.exists() else None
              stages.append({'stage':data.get('stage') if data else path.stem,'present':path.exists(),'status':data.get('status') if data else 'MISSING'})
          report={'flight':'${{ matrix.flight }}','commit_sha':'${{ github.sha }}','run_id':'${{ github.run_id }}','stages':stages,'all_stage_receipts_present':all(s['present'] for s in stages),'all_stage_passed':all(s['status']=='PASS' for s in stages)}
          Path('flight_receipt.json').write_text(json.dumps(report,indent=2)); print(json.dumps(report,indent=2))
          if not report['all_stage_receipts_present'] or not report['all_stage_passed']: raise SystemExit(1)
          PY
      - name: Upload flight evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sage-five-flight-${{ matrix.flight }}-${{ github.sha }}
          path: flight_*.json
          if-no-files-found: error
  wave-gate:
    needs: flight
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all five flights
        run: |
          test '${{ needs.flight.result }}' = 'success'
          echo 'FIVE_FLIGHT_WAVE=VERIFIED'
