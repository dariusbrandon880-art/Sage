name: SAGE Five-Flight Mission Wave

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit SHA to execute
        required: true
        type: string

permissions:
  contents: read

env:
  SAGE_CI_OPENAI_STUB: "1"

# Five Flights are adaptive execution units, not permanent feature/domain owners.
# Mission/profile selection is supplied by C2. Capability-specific verification
# remains verification infrastructure and is not a flight identity.
jobs:
  flight:
    name: "Flight ${{ matrix.flight }}"
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {flight: "003", command: "python scripts/run_longitudinal_flight_003.py"}
          - {flight: "004", command: "python scripts/run_longitudinal_campaign_flight.py --flight 004"}
          - {flight: "005", command: "python scripts/run_longitudinal_campaign_flight.py --flight 005"}
          - {flight: "006", command: "python scripts/run_longitudinal_campaign_flight.py --flight 006"}
          - {flight: "007", command: "python scripts/run_longitudinal_campaign_flight.py --flight 007"}
    runs-on: ubuntu-latest
    steps:
      - name: Resolve execution commit
        id: pin
        shell: bash
        env:
          INPUT_SHA: ${{ inputs.commit_sha }}
        run: |
          set -euo pipefail
          sha="${INPUT_SHA:-${{ github.sha }}}"
          [[ "$sha" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - name: Checkout exact execution commit
        uses: actions/checkout@v5
        with:
          ref: ${{ steps.pin.outputs.sha }}
          fetch-depth: 1
      - name: Verify exact checkout
        run: test "$(git rev-parse HEAD)" = "${{ steps.pin.outputs.sha }}"
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install repository
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Governance preflight
        run: python scripts/sage_precommit_hook.py
      - name: Execute assigned flight
        env:
          FLIGHT: ${{ matrix.flight }}
          TARGET_SHA: ${{ steps.pin.outputs.sha }}
        run: |
          set -o pipefail
          ${{ matrix.command }} > raw.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          flight = os.environ["FLIGHT"]
          sha = os.environ["TARGET_SHA"]
          try:
              payload = json.loads(Path("raw.txt").read_text())
              if not isinstance(payload, dict):
                  raise ValueError("flight output is not an object")
          except Exception as exc:
              payload = {"verdict": "HOLD", "parse_error": str(exc)}
          payload["flight"] = flight
          payload["exact_head_sha"] = sha
          payload["flight_authority"] = "adaptive_execution_unit"
          Path(f"flight_{flight}.json").write_text(json.dumps(payload, indent=2, sort_keys=True) + "\n")
          print(json.dumps(payload, indent=2, sort_keys=True))
          if payload.get("verdict") == "HOLD":
              raise SystemExit(1)
          PY
      - name: Publish flight evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sage-five-mission-${{ matrix.flight }}-${{ steps.pin.outputs.sha }}
          path: flight_${{ matrix.flight }}.json
          if-no-files-found: error

  wave-gate:
    name: C2 Five-Flight Fail-Closed Reconvergence
    needs: flight
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require all five flights
        run: |
          test "${{ needs.flight.result }}" = "success"
          echo 'FIVE_FLIGHT_WAVE=EXECUTION_COMPLETE_PENDING_INDEPENDENT_C2_VERIFICATION'
