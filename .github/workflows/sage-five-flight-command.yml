name: SAGE Control Tower Five-Flight Command

on:
  issue_comment:
    types: [created]
  workflow_dispatch:
    inputs:
      commit_sha:
        description: Exact 40-character commit SHA to execute
        required: true
        type: string

permissions:
  contents: read

jobs:
  pin:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.issue.number == 196 && !github.event.issue.pull_request && github.actor == 'dariusbrandon880-art' && github.event.comment.body == '/sage launch five-flight')
    runs-on: ubuntu-latest
    outputs:
      exact_head_sha: ${{ steps.pin.outputs.exact_head_sha }}
    steps:
      - id: pin
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = workflow_dispatch ]; then sha="${{ inputs.commit_sha }}"; else sha="$(git ls-remote "https://github.com/${{ github.repository }}.git" refs/heads/main | awk '{print $1}')"; fi
          [[ "$sha" =~ ^[0-9a-fA-F]{40}$ ]]
          echo "exact_head_sha=$sha" >> "$GITHUB_OUTPUT"

  launch:
    needs: pin
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - {flight: '003', command: 'python scripts/run_longitudinal_flight_003.py'}
          - {flight: '004', command: 'python scripts/run_longitudinal_campaign_flight.py --flight 004'}
          - {flight: '005', command: 'python scripts/run_longitudinal_campaign_flight.py --flight 005'}
          - {flight: '006', command: 'python scripts/run_longitudinal_campaign_flight.py --flight 006'}
          - {flight: '007', command: 'python scripts/run_longitudinal_campaign_flight.py --flight 007'}
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.pin.outputs.exact_head_sha }}', fetch-depth: 1}
      - run: test "$(git rev-parse HEAD)" = "${{ needs.pin.outputs.exact_head_sha }}"
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install --upgrade pip && pip install -e '.[dev]'
      - run: python scripts/sage_precommit_hook.py
      - env: {FLIGHT: '${{ matrix.flight }}', TARGET_SHA: '${{ needs.pin.outputs.exact_head_sha }}'}
        run: |
          set -euo pipefail
          ${{ matrix.command }} > raw.txt
          python - <<'PY'
          import json,os
          from pathlib import Path
          f=os.environ['FLIGHT']; sha=os.environ['TARGET_SHA']; out=Path(f'longitudinal_flight_{f}_stdout.json')
          try:
              p=json.loads(Path('raw.txt').read_text()); assert isinstance(p,dict); p['flight']=f; p['exact_head_sha']=sha
          except Exception as e: p={'flight':f,'verdict':'HOLD','exact_head_sha':sha,'parse_error':str(e)}
          out.write_text(json.dumps(p,indent=2)+'\n'); print(json.dumps(p,indent=2))
          if p.get('verdict')=='HOLD': raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sage-command-flight-${{ matrix.flight }}-${{ needs.pin.outputs.exact_head_sha }}
          path: longitudinal_flight_${{ matrix.flight }}_stdout.json
          if-no-files-found: error

  reconverge:
    needs: [pin, launch]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: '${{ needs.pin.outputs.exact_head_sha }}', fetch-depth: 1}
      - run: test "$(git rev-parse HEAD)" = "${{ needs.pin.outputs.exact_head_sha }}"
      - uses: actions/download-artifact@v4
        with:
          pattern: sage-command-flight-*-${{ needs.pin.outputs.exact_head_sha }}
          path: five-flight-evidence
          merge-multiple: true
      - env: {EXPECTED_SHA: '${{ needs.pin.outputs.exact_head_sha }}'}
        run: |
          python - <<'PY'
          import json,os
          from pathlib import Path
          sha=os.environ['EXPECTED_SHA']; expected={'003','004','005','006','007'}; reports=[]
          for p in Path('five-flight-evidence').glob('longitudinal_flight_*_stdout.json'):
              try: reports.append(json.loads(p.read_text()))
              except Exception as e: reports.append({'verdict':'HOLD','parse_error':str(e)})
          observed={str(r.get('flight','')) for r in reports}; bad=[r.get('exact_head_sha') for r in reports if r.get('exact_head_sha')!=sha]
          receipt={'wave':'SAGE-FIVE-FLIGHT-COMMAND','exact_head_sha':sha,'expected_flights':sorted(expected),'observed_flights':sorted(observed),'flight_count':len(reports),'sha_mismatches':bad,'wave_verdict':'HOLD' if observed!=expected or len(reports)!=5 or bad else 'REQUIRES_INDEPENDENT_C2_VERIFICATION'}
          Path('five_flight_command_receipt.json').write_text(json.dumps(receipt,indent=2)+'\n'); print(json.dumps(receipt,indent=2))
          if receipt['wave_verdict']=='HOLD': raise SystemExit(1)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sage-five-flight-command-receipt-${{ needs.pin.outputs.exact_head_sha }}
          path: five_flight_command_receipt.json
          if-no-files-found: error
