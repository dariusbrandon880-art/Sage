name: SAGE Control Tower Five-Flight Command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read

jobs:
  launch:
    if: >-
      github.event.issue.number == 196 &&
      !github.event.issue.pull_request &&
      github.actor == 'dariusbrandon880-art' &&
      github.event.comment.body == '/sage launch five-flight'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - flight: "003"
            command: python scripts/run_longitudinal_flight_003.py
          - flight: "004"
            command: python scripts/run_longitudinal_campaign_flight.py --flight "004"
          - flight: "005"
            command: python scripts/run_longitudinal_campaign_flight.py --flight "005"
          - flight: "006"
            command: python scripts/run_longitudinal_campaign_flight.py --flight "006"
          - flight: "007"
            command: python scripts/run_longitudinal_campaign_flight.py --flight "007"
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Assert exact checkout HEAD
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "${{ github.sha }}" =~ ^[0-9a-fA-F]{40}$

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Governance preflight
        run: python scripts/sage_precommit_hook.py

      - name: Execute commanded flight ${{ matrix.flight }}
        run: |
          set -o pipefail
          ${{ matrix.command }} | tee "longitudinal_flight_${{ matrix.flight }}_stdout.json"
          printf '%s\n' "${{ github.sha }}" > "longitudinal_flight_${{ matrix.flight }}_head_sha.txt"

      - name: Upload flight evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sage-command-flight-${{ matrix.flight }}-${{ github.sha }}
          path: |
            longitudinal_flight_${{ matrix.flight }}_stdout.json
            longitudinal_flight_${{ matrix.flight }}_head_sha.txt
          if-no-files-found: ignore

  reconverge:
    if: >-
      github.event.issue.number == 196 &&
      !github.event.issue.pull_request &&
      github.actor == 'dariusbrandon880-art' &&
      github.event.comment.body == '/sage launch five-flight'
    needs: launch
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Assert exact reconvergence HEAD
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.sha }}"
          test "${{ github.sha }}" =~ ^[0-9a-fA-F]{40}$

      - name: Download commanded flight evidence
        uses: actions/download-artifact@v4
        with:
          pattern: sage-command-flight-*
          path: five-flight-evidence
          merge-multiple: true

      - name: Build exact-head compound command receipt
        env:
          EXACT_HEAD_SHA: ${{ github.sha }}
        run: |
          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          root = Path('five-flight-evidence')
          expected = {'003', '004', '005', '006', '007'}
          exact_head_sha = os.environ['EXACT_HEAD_SHA']
          if not re.fullmatch(r'[0-9a-fA-F]{40}', exact_head_sha):
              raise SystemExit('invalid exact HEAD SHA: 40 hexadecimal characters required')

          reports = []
          for path in sorted(root.glob('longitudinal_flight_*_stdout.json')):
              try:
                  reports.append(json.loads(path.read_text()))
              except Exception as exc:
                  reports.append({'flight': path.stem, 'verdict': 'HOLD', 'parse_error': str(exc)})

          observed = {str(r.get('flight', '')).split('-')[-1] for r in reports}
          head_files = sorted(root.glob('longitudinal_flight_*_head_sha.txt'))
          head_shas = {p.read_text().strip() for p in head_files}
          invalid_head_shas = sorted(
              sha for sha in head_shas if not re.fullmatch(r'[0-9a-fA-F]{40}', sha)
          )
          head_match = head_shas == {exact_head_sha} and len(head_files) == len(expected)
          missing = sorted(expected - observed)

          verdict = 'HOLD' if missing or invalid_head_shas or not head_match else 'REQUIRES_INDEPENDENT_C2_VERIFICATION'
          receipt = {
              'wave': 'SAGE-FIVE-FLIGHT-COMMAND',
              'exact_head_sha': exact_head_sha,
              'expected_flights': sorted(expected),
              'observed_flights': sorted(observed),
              'missing_flights': missing,
              'flight_head_sha_count': len(head_files),
              'flight_head_shas': sorted(head_shas),
              'head_sha_consistent': head_match,
              'invalid_head_shas': invalid_head_shas,
              'wave_verdict': verdict,
              'authority_boundary': 'Observation aggregation only; no capability qualification.'
          }
          receipt_path = Path(os.environ.get('RUNNER_TEMP', '/tmp')) / 'five_flight_command_receipt.json'
          receipt_path.write_text(json.dumps(receipt, indent=2) + '\n')
          print(json.dumps(receipt, indent=2))
          if verdict == 'HOLD':
              raise SystemExit('five-flight reconvergence evidence failed exact-head validation')
          PY

      - name: Upload compound receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sage-five-flight-command-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/five_flight_command_receipt.json
          if-no-files-found: error
