name: SAGE C2 Enterprise Convergence

on:
  pull_request:
    paths:
      - 'sage/**'
      - 'tests/**'
      - 'docs/governance/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  convergence:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact PR HEAD
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -e '.[dev]'

      - name: Run cross-model regression tests
        run: pytest -q tests/runtime/test_cross_model_audit.py

      - name: Run governance and C2 regression suite
        run: pytest -q tests -m 'not slow' --disable-warnings --maxfail=1

      - name: Assert exact HEAD
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          actual="$(git rev-parse HEAD)"
          test "$actual" = "$EXPECTED_SHA"
          echo "Verified exact execution HEAD: $actual"
