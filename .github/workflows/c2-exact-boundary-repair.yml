name: C2 Exact Boundary Repair v2

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'feat/c2-continuous-exchange-immersion-lock' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Apply exact canonical flight binding repair
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('sage/integration.py')
          text = p.read_text()
          old = '            flight_id="FLIGHT_001",\n'
          new = '            flight_id=str(c2_context["flight_id"]),\n'
          if old not in text:
              raise SystemExit('expected synthetic FLIGHT_001 assignment not found')
          p.write_text(text.replace(old, new, 1))
          PY
          python -m compileall -q sage/integration.py
          git diff --check
          git diff -- sage/integration.py
      - name: Commit repair
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add sage/integration.py
          git diff --cached --check
          git commit -m 'fix(c2): bind immersion flight to canonical runtime identity'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
