services:
  - type: web
    name: sage-runtime
    env: python
    plan: free
    healthCheckPath: /health
    buildCommand: "pip install --upgrade pip && pip install ."
    startCommand: "python scripts/run_openai_runtime_activation.py && uvicorn sage.experimental.observatory.server:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: SAGE_REQUIRE_AUTH
        value: "true"
      - key: SAGE_API_KEYS
        generateValue: true
        scope: run_and_build
      - key: MEMORY_BACKEND
        value: disk
      - key: ARCHIVE_BACKEND
        value: disk
      - key: ENABLE_CONTINUITY
        value: "true"
      - key: GOOGLE_WORKSPACE_CREDENTIALS_PATH
        value: .sage/credentials.json
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: SAGE_AUTH_SECRET
        generateValue: true
        scope: run_and_build
      - key: CHATGPT_MODEL
        value: gpt-4
      - key: CHATGPT_MAX_TOKENS
        value: "2048"
      - key: CHATGPT_TEMPERATURE
        value: "0.7"
      - key: CHATGPT_EVIDENCE_CAPTURE
        value: "true"
