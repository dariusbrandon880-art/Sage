services:
  - type: web
    name: sage-runtime
    env: python
    plan: free
    healthCheckPath: /health
    buildCommand: "pip install poetry && poetry install --no-root"
    startCommand: "python scripts/run_openai_runtime_activation.py && uvicorn sage.runtime:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: ENV
        value: production
      - key: DEBUG
        value: "false"
      - key: PORT
        value: 8000
      - key: HOST
        value: 0.0.0.0
      - key: SAGE_REQUIRE_AUTH
        value: "true"
      - key: SAGE_API_KEYS
        generateValue: true
      - key: MEMORY_BACKEND
        value: in-memory
      - key: ARCHIVE_BACKEND
        value: in-memory
      - key: ENABLE_CONTINUITY
        value: "true"
      - key: GOOGLE_WORKSPACE_CREDENTIALS_PATH
        value: .sage/credentials.json
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
